<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Grid View Full - Fashion Store</title>

    <!-- Thẻ base trỏ về thư mục gốc Front_end -->
    <base href="../../../">

    <!-- CSS STYLESHEETS -->
    <link rel="stylesheet" href="components/common/common.css">
    <link rel="stylesheet" href="components/layout/header/header.css">
    <link rel="stylesheet" href="components/layout/footer/footer.css">
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- Page CSS riêng cho Grid View Full -->
    <link rel="stylesheet" href="pages/categori/categori_grid_view_full/categori_grid_view_full.css">
</head>
<body>

    <div class="mobile-wrapper">

        <!-- HEADER COMPONENT -->
        <div id="header-component"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="container">
                <!-- Header của danh mục & các nút điều khiển -->
                <div class="category-top">
                    <div class="category-title-area">
                        <h2>4500 APPAREL</h2>
                    </div>
                    <div class="category-controls">
                        <button class="btn-dropdown" type="button">
                            New 
                            <span class="arrow-down"></span>
                        </button>
                        <button class="btn-icon active" type="button" title="Grid View">
                            <img src="assets/icons/Gallery.svg" alt="View Switcher">
                        </button>
                        <button class="btn-icon" type="button" title="Filter">
                            <img src="assets/icons/filter.svg" alt="Filter">
                        </button>
                    </div>
                </div>

                <!-- Các tag filter (được xử lý động bởi JS từ URL) -->
                <div class="filter-tags"></div>

                <!-- Danh sách sản phẩm dạng Grid Full (Đủ 5 sản phẩm) -->
                <div class="product-grid-full">
                    <!-- Sản phẩm 1 -->
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img src="assets/images/category/category_Grid_view_full/category1.png" alt="Recycle Boucle Knit Cardigan Pink">
                            <button class="wishlist-btn" type="button"><i class="heart-icon"></i></button>
                        </div>
                        <div class="product-info">
                            <span class="product-brand">M O H A N</span>
                            <h4 class="product-name">Recycle Boucle Knit Cardigan Pink</h4>
                            <p class="product-price">$120</p>
                        </div>
                    </div>

                    <!-- Sản phẩm 2 -->
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img src="assets/images/category/category_Grid_view_full/category2.png" alt="Recycle Boucle Knit Cardigan Pink">
                            <button class="wishlist-btn" type="button"><i class="heart-icon"></i></button>
                        </div>
                        <div class="product-info">
                            <span class="product-brand">M O H A N</span>
                            <h4 class="product-name">Recycle Boucle Knit Cardigan Pink</h4>
                            <p class="product-price">$120</p>
                        </div>
                    </div>

                    <!-- Sản phẩm 3 -->
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img src="assets/images/category/category_Grid_view_full/category3.png" alt="Recycle Boucle Knit Cardigan Pink">
                            <button class="wishlist-btn" type="button"><i class="heart-icon"></i></button>
                        </div>
                        <div class="product-info">
                            <span class="product-brand">M O H A N</span>
                            <h4 class="product-name">Recycle Boucle Knit Cardigan Pink</h4>
                            <p class="product-price">$120</p>
                        </div>
                    </div>

                    <!-- Sản phẩm 4 -->
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img src="assets/images/category/category_Grid_view_full/category4.png" alt="Recycle Boucle Knit Cardigan Pink">
                            <button class="wishlist-btn" type="button"><i class="heart-icon"></i></button>
                        </div>
                        <div class="product-info">
                            <span class="product-brand">M O H A N</span>
                            <h4 class="product-name">Recycle Boucle Knit Cardigan Pink</h4>
                            <p class="product-price">$120</p>
                        </div>
                    </div>

                    <!-- Sản phẩm 5 -->
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img src="assets/images/category/category_Grid_view_full/category5.png" alt="Recycle Boucle Knit Cardigan Pink">
                            <button class="wishlist-btn" type="button"><i class="heart-icon"></i></button>
                        </div>
                        <div class="product-info">
                            <span class="product-brand">M O H A N</span>
                            <h4 class="product-name">Recycle Boucle Knit Cardigan Pink</h4>
                            <p class="product-price">$120</p>
                        </div>
                    </div>
                </div>

                <!-- Phân trang (Pagination) -->
                <div class="pagination">
                    <button class="page-item active" type="button">1</button>
                    <button class="page-item" type="button">2</button>
                    <button class="page-item" type="button">3</button>
                    <button class="page-item" type="button">4</button>
                    <button class="page-item" type="button">5</button>
                    <button class="page-item next" type="button">&gt;</button>
                </div>
            </div>
        </main>

        <!-- FOOTER COMPONENT -->
        <div id="footer-component"></div>

    </div>

    <!-- JAVASCRIPT -->
    <script type="module" src="pages/categori/categori_grid_view_full/categori_grid_view_full.js"></script>

</body>
</html>
