<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Grid - Open Fashion</title>

    <!-- CSS STYLESHEETS (Đường dẫn lùi 3 cấp ../../../) -->
    <link rel="stylesheet" href="../../../components/common/common.css">
    <link rel="stylesheet" href="../../../components/layout/header/header.css">
    <link rel="stylesheet" href="../../../components/layout/footer/footer.css">
    <link rel="stylesheet" href="../../../styles/main.css">
    
    <!-- Page CSS -->
    <link rel="stylesheet" href="./blog_grid_view.css">
</head>

<body>

    <div class="mobile-wrapper">

        <!-- HEADER COMPONENT -->
        <div id="header-component"></div>

        <!-- MAIN CONTENT -->
        <main class="blog-container">

            <!-- Tiêu đề & Danh mục -->
            <section class="blog-filter-section">
                <h1 class="blog-title">BLOG</h1>

                <div class="blog-categories">
                    <button type="button" class="category-btn active">Fashion</button>
                    <button type="button" class="category-btn">Promo</button>
                    <button type="button" class="category-btn">Policy</button>
                    <button type="button" class="category-btn">Lookbook</button>
                    <button type="button" class="category-btn">Sale</button>
                </div>
            </section>

            <section class="blog-grid">

                <!-- Blog Item 1 -->
                <article class="blog-item" data-blog-id="1">
                    <div class="blog-image-wrapper">
                        <img src="../../../assets/images/blogGridView/Blog1.png"
                             alt="2021 Style Guide: The Biggest Fall Trends"
                             class="blog-img">

                        <button type="button" class="bookmark-btn" aria-label="Lưu bài viết">
                            <svg width="14" height="18" viewBox="0 0 14 18" fill="none">
                                <path d="M13 17L7 12L1 17V1H13V17Z"
                                      stroke="white"
                                      stroke-width="1.5"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>
                            </svg>
                        </button>

                        <h2 class="blog-item-title">
                            2021 STYLE GUIDE: THE BIGGEST FALL TRENDS
                        </h2>
                    </div>

                    <div class="blog-meta">
                        <div class="blog-tags">
                            <span class="tag">#Fashion</span>
                            <span class="tag">#Tips</span>
                        </div>

                        <span class="blog-date">4 days ago</span>
                    </div>
                </article>

                <!-- Blog Item 2 -->
                <article class="blog-item" data-blog-id="2">
                    <div class="blog-image-wrapper">
                        <img src="../../../assets/images/blogGridView/Blog2.png"
                             alt="2021 Style Guide: The Biggest Fall Trends"
                             class="blog-img">

                        <button type="button" class="bookmark-btn" aria-label="Lưu bài viết">
                            <svg width="14" height="18" viewBox="0 0 14 18" fill="none">
                                <path d="M13 17L7 12L1 17V1H13V17Z"
                                      stroke="white"
                                      stroke-width="1.5"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>
                            </svg>
                        </button>

                        <h2 class="blog-item-title">
                            2021 STYLE GUIDE: THE BIGGEST FALL TRENDS
                        </h2>
                    </div>

                    <div class="blog-meta">
                        <div class="blog-tags">
                            <span class="tag">#Fashion</span>
                            <span class="tag">#Tips</span>
                        </div>

                        <span class="blog-date">4 days ago</span>
                    </div>
                </article>

                <!-- Blog Item 3 -->
                <article class="blog-item" data-blog-id="3">
                    <div class="blog-image-wrapper">
                        <img src="../../../assets/images/blogGridView/Blog3.png"
                             alt="2021 Style Guide: The Biggest Fall Trends"
                             class="blog-img">

                        <button type="button" class="bookmark-btn" aria-label="Lưu bài viết">
                            <svg width="14" height="18" viewBox="0 0 14 18" fill="none">
                                <path d="M13 17L7 12L1 17V1H13V17Z"
                                      stroke="white"
                                      stroke-width="1.5"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>
                            </svg>
                        </button>

                        <h2 class="blog-item-title">
                            2021 STYLE GUIDE: THE BIGGEST FALL TRENDS
                        </h2>
                    </div>

                    <div class="blog-meta">
                        <div class="blog-tags">
                            <span class="tag">#Fashion</span>
                            <span class="tag">#Tips</span>
                        </div>

                        <span class="blog-date">4 days ago</span>
                    </div>
                </article>

                <!-- Blog Item 4 -->
                <article class="blog-item" data-blog-id="4">
                    <div class="blog-image-wrapper">
                        <img src="../../../assets/images/blogGridView/Blog4.png"
                             alt="2021 Style Guide: The Biggest Fall Trends"
                             class="blog-img">

                        <button type="button" class="bookmark-btn" aria-label="Lưu bài viết">
                            <svg width="14" height="18" viewBox="0 0 14 18" fill="none">
                                <path d="M13 17L7 12L1 17V1H13V17Z"
                                      stroke="white"
                                      stroke-width="1.5"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>
                            </svg>
                        </button>

                        <h2 class="blog-item-title">
                            2021 STYLE GUIDE: THE BIGGEST FALL TRENDS
                        </h2>
                    </div>

                    <div class="blog-meta">
                        <div class="blog-tags">
                            <span class="tag">#Fashion</span>
                            <span class="tag">#Tips</span>
                        </div>

                        <span class="blog-date">4 days ago</span>
                    </div>
                </article>

            </section>

            <!-- Nút Load More -->
            <div class="load-more-container">
                <button type="button" class="load-more-btn">
                    LOAD MORE
                    <span class="plus-icon">+</span>
                </button>
            </div>

        </main>

        <!-- FOOTER COMPONENT -->
        <div id="footer-component"></div>

    </div>

    <!-- JAVASCRIPT -->
    <script type="module" src="./blog_grid_view.js"></script>

</body>
</html>
