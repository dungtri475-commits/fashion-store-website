<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Method - Open Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../checkout-responsive.css">
  <style>
    body { font-family: 'Tenor Sans', sans-serif; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="checkout-page bg-gray-100 flex justify-center items-center min-h-screen">

  <div class="checkout-shell w-full max-w-[375px] bg-white min-h-[812px] shadow-lg flex flex-col justify-between relative">
    
    <div>
      <!-- 1. HEADER -->
      <header >
        
      </header>

      <!-- 2. TITLE SECTION -->
      <div class="text-center my-6">
        <h2 class="text-sm font-semibold tracking-[0.3em] uppercase text-gray-800">PAYMENT METHOD</h2>
        <div class="flex items-center justify-center mt-2">
          <div class="h-[1px] w-12 bg-gray-300"></div>
          <div class="w-1.5 h-1.5 border border-gray-400 transform rotate-45 mx-1"></div>
          <div class="h-[1px] w-12 bg-gray-300"></div>
        </div>
      </div>

      <!-- 3. CREDIT CARD PREVIEW -->
      <div id="card-preview" class="px-4 mb-6">
        <div class="w-full h-48 bg-gradient-to-r from-gray-800 via-gray-900 to-black text-white rounded-xl p-5 flex flex-col justify-between shadow-md relative overflow-hidden">
          <div class="flex justify-between items-center">
            <span class="text-xs tracking-widest uppercase text-gray-300 font-semibold">Master Card</span>
            <div class="w-8 h-5 bg-orange-500/80 rounded-sm flex items-center justify-center font-bold text-[10px]">MC</div>
          </div>
          
          <div class="text-lg tracking-widest my-2">
            •••• •••• •••• 4567
          </div>

          <div class="flex justify-between items-end text-xs">
            <div>
              <p class="text-[9px] text-gray-400 uppercase">Card Holder</p>
              <p class="font-medium">Iris Watson</p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase">Exp Date</p>
              <p class="font-medium">05/26</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. ADD PAYMENT METHOD BUTTON -->
      <div class="px-4">
        <a href="./add_card.html" class="w-full bg-gray-50 rounded-full py-3 px-5 flex items-center justify-between text-xs text-gray-600 hover:bg-gray-100 transition">
          <span>Add payment method</span>
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- 5. FOOTER CONFIRM BUTTON -->
    <div class="p-4 bg-white border-t border-gray-100">
      <a href="../step2_address/shipping_address.html" id="confirm-payment" class="w-full bg-black text-white py-3.5 flex items-center justify-center text-xs uppercase tracking-widest hover:bg-gray-800 transition">
        CONFIRM PAYMENT METHOD
      </a>
    </div>

  </div>
  <script type="module" src="./payment_method.js"></script>

</body>
</html>
