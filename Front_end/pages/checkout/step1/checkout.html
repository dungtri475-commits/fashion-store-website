<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Step 1 - Open Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./checkout.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <!-- Mobile Container Frame -->
  <div class="w-full max-w-[375px] bg-white min-h-[812px] shadow-lg flex flex-col justify-between relative">
    
    <div>
      <!-- 1. HEADER -->
      <header></header> 

    
      <!-- 2. TITLE SECTION -->
      <div class="text-center my-6">
        <h2 class="text-sm font-semibold tracking-[0.3em] uppercase text-gray-800">CHECKOUT</h2>
        <div class="flex items-center justify-center mt-2">
          <div class="h-[1px] w-12 bg-gray-300"></div>
          <div class="w-1.5 h-1.5 border border-gray-400 transform rotate-45 mx-1"></div>
          <div class="h-[1px] w-12 bg-gray-300"></div>
        </div>
      </div>

      <!-- 3. CART ITEM LIST -->
      <div class="px-4 space-y-4" id="cart-items-container">
        <!-- Item 1 -->
        <div class="flex items-start space-x-3 cart-item" data-price="120">
          <div class="w-24 h-32 bg-gray-100 flex-shrink-0">
            <img src="../../../assets/images/category/category_Grid_view/category1.png" alt="Lamerei Cardigan" class="w-full h-full object-cover">
          </div>
          
          <div class="flex-1 pt-1">
            <h3 class="text-xs font-bold uppercase tracking-widest text-gray-800">LAMEREI</h3>
            <p class="text-[11px] text-gray-500 mt-1">Recycle Boucle Knit Cardigan Pink</p>
            
            <div class="flex items-center space-x-3 mt-3">
              <button class="btn-decrease w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center text-xs text-gray-600 hover:bg-gray-100">-</button>
              <span class="item-quantity text-xs text-gray-800">1</span>
              <button class="btn-increase w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center text-xs text-gray-600 hover:bg-gray-100">+</button>
            </div>
            
            <p class="text-xs text-orange-400 font-medium mt-3">$<span class="item-price">120</span></p>
          </div>
        </div>
      </div>

      <!-- 4. PROMO CODE & DELIVERY OPTIONS -->
      <div class="px-4 mt-6 space-y-3">
        <div class="flex items-center justify-between py-3 border-t border-b border-gray-200">
          <div class="flex items-center space-x-3 w-full">
            <svg class="w-5 h-5 text-gray-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
            </svg>
            <input type="text" id="promo-input" placeholder="Add promo code" class="text-xs text-gray-700 bg-transparent outline-none w-full placeholder-gray-400">
          </div>
        </div>

        <!-- Delivery Fee -->
        <div class="flex items-center justify-between py-3 border-b border-gray-200">
          <div class="flex items-center space-x-3">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
            </svg>
            <span class="text-xs text-gray-700">Delivery</span>
          </div>
          <span class="text-xs text-gray-500">Free</span>
        </div>
      </div>
    </div>

    <!-- 5. FOOTER / TOTAL & CHECKOUT BUTTON -->
    <div class="p-4 bg-white border-t border-gray-100">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-semibold tracking-widest uppercase text-gray-600">EST. TOTAL</span>
        <span class="text-sm font-semibold text-orange-400">$<span id="total-price">120</span></span>
      </div>

      <a href="../step2_address/shipping_address.html" id="btn-checkout" class="w-full bg-black text-white py-3.5 flex items-center justify-center space-x-2 text-xs uppercase tracking-widest hover:bg-gray-800 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span>CHECKOUT</span>
      </a>
    </div>

  </div>

  <script src="./checkout.js"></script>
</body>
</html>
