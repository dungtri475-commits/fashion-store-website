<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Shipping Address - Open Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tenor Sans', sans-serif; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <div class="w-full max-w-[375px] bg-white min-h-[812px] shadow-lg flex flex-col justify-between relative">
    
    <div>
      <!-- 1. HEADER -->
      <header></header> 

      <!-- 2. TITLE SECTION -->
      <div class="text-center my-6">
        <h2 class="text-sm font-semibold tracking-[0.3em] uppercase text-gray-800">ADD SHIPPING ADDRESS</h2>
        <div class="flex items-center justify-center mt-2">
          <div class="h-[1px] w-12 bg-gray-300"></div>
          <div class="w-1.5 h-1.5 border border-gray-400 transform rotate-45 mx-1"></div>
          <div class="h-[1px] w-12 bg-gray-300"></div>
        </div>
      </div>

      <!-- 3. ADD ADDRESS FORM -->
      <form id="add-address-form" class="px-4 space-y-5">
        <div class="flex space-x-4">
          <div class="w-1/2">
            <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">First Name</label>
            <input type="text" placeholder="Iris" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
          </div>
          <div class="w-1/2">
            <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">Last Name</label>
            <input type="text" placeholder="Watson" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">Address</label>
          <input type="text" placeholder="2353/2C Tran Hung Dao Street" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
        </div>

        <div>
          <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">City</label>
          <input type="text" placeholder="Ho Chi Minh City" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
        </div>

        <div class="flex space-x-4">
          <div class="w-1/2">
            <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">State</label>
            <input type="text" placeholder="District 1" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
          </div>
          <div class="w-1/2">
            <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">Zip Code</label>
            <input type="text" placeholder="700000" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-semibold tracking-widest text-gray-400 uppercase mb-1">Phone Number</label>
          <input type="tel" placeholder="+84 901 234 567" class="w-full border-b border-gray-300 py-2 text-xs text-gray-800 focus:border-black outline-none transition" required>
        </div>
      </form>
    </div>

    <!-- 4. FOOTER ADD ADDRESS BUTTON -->
    <div class="p-4 bg-white border-t border-gray-100">
      <button type="submit" form="add-address-form" class="w-full bg-black text-white py-3.5 flex items-center justify-center text-xs uppercase tracking-widest hover:bg-gray-800 transition">
        ADD NOW
      </button>
    </div>

  </div>

  <script>
    document.getElementById('add-address-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Address added successfully!');
      window.location.href = '../review/checkout_review.html';
    });
  </script>
</body>
</html>
