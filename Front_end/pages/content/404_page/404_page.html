<!DOCTYPE html>
<html lang="vi">
<head>

    <title>404 Page Not Found - Open Fashion</title>
    
    <!-- Link CSS layout chung của Header & Footer -->
    <link rel="stylesheet" href="../../../components/layout/header/header.css">

    <!-- Link CSS riêng của trang 404 -->
    <link rel="stylesheet" href="./404_page.css">
</head>
<body>

    <div class="page_frame">

            <p class="not_found_description">
                We can't find the page you<br>looking for, it will return to the
            </p>

            <a href="../../../fashion_store.html#/home" class="btn_home">

                        <path d="M17 7H1M7 13L1 7L7 1" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Container Footer (JS sẽ tự render) -->
        <footer id="footer-component"></footer>

    <script type="module" src="./404_page.js"></script>

</html>
