<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Open Fashion - Collection</title>

    <!-- ================= HEADER CSS ================= -->
    <link
        rel="stylesheet"
        href="../../../components/layout/header/header.css"
    >

    <!-- ================= COLLECTION CSS ================= -->
    <link
        rel="stylesheet"
        href="collection_landing_page.css"
    >

    <!-- ================= FOOTER CSS ================= -->
    <link
        rel="stylesheet"
        href="../../../components/layout/footer/footer.css"
    >
</head>


<body>

    <!--
        Khung chính của giao diện mobile 375px
    -->
    <div class="mobile-container">


        <!-- ==================================================
             HEADER
             Header được render bằng JavaScript
             ================================================== -->

        <header id="header-component"></header>


        <!-- ==================================================
             COLLECTION
             ================================================== -->

        <main class="main-content">


            <!-- ================= COLLECTION 01 ================= -->

            <section class="collection-item">

                <!--
                    Chỉ Collection 01 có tiêu đề
                    October
                    COLLECTION
                -->
                <div class="collection-header-text">

                    <h1 class="main-title">
                        October
                    </h1>

                    <p class="sub-title">
                        COLLECTION
                    </p>

                </div>


                <!-- Ảnh Collection 01 -->

                <div class="image-wrapper">

                    <img
                        src="../../../assets/images/collection/collection1.png"
                        alt="October Collection"
                    >

                </div>


                <!-- Thông tin phía dưới ảnh -->

                <div class="collection-footer-text">

                    <span class="number">
                        01
                    </span>

                    <span
                        class="collection-line"
                        aria-hidden="true"
                    ></span>

                    <span class="label">
                        OCTOBER COLLECTION
                    </span>

                </div>

            </section>



            <!-- ================= COLLECTION 02 ================= -->

            <section class="collection-item">

                <!--
                    KHÔNG thêm:
                    Black
                    COLLECTION

                    vì Figma không có phần này
                -->


                <!-- Ảnh Collection 02 -->

                <div class="image-wrapper">

                    <img
                        src="../../../assets/images/collection/collection2.png"
                        alt="Black Collection"
                    >

                </div>


                <!-- Thông tin phía dưới ảnh -->

                <div class="collection-footer-text">

                    <span class="number">
                        02
                    </span>

                    <span
                        class="collection-line"
                        aria-hidden="true"
                    ></span>

                    <span class="label">
                        BLACK COLLECTION
                    </span>

                </div>

            </section>



            <!-- ================= COLLECTION 03 ================= -->

            <section class="collection-item">

                <!--
                    KHÔNG thêm:
                    New
                    COLLECTION

                    vì Figma không có phần này
                -->


                <!-- Ảnh Collection 03 -->

                <div class="image-wrapper">

                    <img
                        src="../../../assets/images/collection/collection3.png"
                        alt="Hae by Haekim"
                    >

                </div>


                <!-- Thông tin phía dưới ảnh -->

                <div class="collection-footer-text">

                    <span class="number">
                        03
                    </span>

                    <span
                        class="collection-line"
                        aria-hidden="true"
                    ></span>

                    <span class="label">
                        HAE BY HAEKIM
                    </span>

                </div>

            </section>


        </main>


        <!-- ==================================================
             FOOTER
             Footer được render bằng JavaScript
             ================================================== -->

        <footer id="footer-component"></footer>


    </div>


    <!--COLLECTION JAVASCRIPT -->

    <script
        type="module"
        src="collection_landing_page.js"
    ></script>

</body>

</html>
