<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>October Collection</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Tenor+Sans&display=swap"
        rel="stylesheet"
    >

    <!-- Header -->
    <link
        rel="stylesheet"
        href="../../../components/layout/header/header.css"
    >

    <!-- Footer -->
    <link
        rel="stylesheet"
        href="../../../components/layout/footer/footer.css"
    >

    <!-- Collection Detail -->
    <link
        rel="stylesheet"
        href="./collection_detail.css"
    >
</head>

<body>

    <!-- HEADER -->
    <div id="header-component"></div>


    <!-- =========================
         COLLECTION DETAIL
    ========================== -->

    <main class="collection-detail">

        <!-- COLLECTION TITLE -->
    
<section class="collection-heading">

    <div class="collection-heading-bg">
        10
    </div>

    <div class="collection-heading-content">

        <h1 class="collection-title">
            October
        </h1>

        <p class="collection-subtitle">
            COLLECTION
        </p>

    </div>

</section>

        <!-- HERO -->
        <section class="collection-hero">

            <img
                src="../../../assets/images/collection/collection1.png"
                alt="October Collection"
                class="hero-image"
            >

        </section>


        <!-- =========================
             PRODUCT GRID
        ========================== -->

        <section class="product-grid">


            <!-- PRODUCT 1 -->
            <article class="product-card">

                <div class="product-image">
                    <img
                        src="../../../assets/images/collection/collection2.png"
                        alt="Black Dress"
                    >
                </div>

                <div class="product-info">
                    <p class="product-name">
                        Black Dress
                    </p>

                    <p class="product-category">
                        Dress
                    </p>

                    <p class="product-price">
                        $95
                    </p>
                </div>

            </article>


            <!-- PRODUCT 2 -->
            <article class="product-card">

                <div class="product-image">
                    <img
                        src="../../../assets/images/collection/collection3.png"
                        alt="Black Shoes"
                    >
                </div>

                <div class="product-info">
                    <p class="product-name">
                        Black Shoes
                    </p>

                    <p class="product-category">
                        Shoes
                    </p>

                    <p class="product-price">
                        $80
                    </p>
                </div>

            </article>


            <!-- PRODUCT 3 -->
            <article class="product-card">

                <div class="product-image">
                    <img
                        src="../../../assets/images/collection/collection4.png"
                        alt="Silver Earrings"
                    >
                </div>

                <div class="product-info">
                    <p class="product-name">
                        Silver Earrings
                    </p>

                    <p class="product-category">
                        Accessories
                    </p>

                    <p class="product-price">
                        $45
                    </p>
                </div>

            </article>


            <!-- PRODUCT 4 -->
            <article class="product-card">

                <div class="product-image">
                    <img
                        src="../../../assets/images/collection/collection5.png"
                        alt="Silver Ring"
                    >
                </div>

                <div class="product-info">
                    <p class="product-name">
                        Silver Ring
                    </p>

                    <p class="product-category">
                        Accessories
                    </p>

                    <p class="product-price">
                        $55
                    </p>
                </div>

            </article>


            <!-- PRODUCT 5 -->
            <article class="product-card">

                <div class="product-image">
                    <img
                        src="../../../assets/images/collection/collection6.png"
                        alt="Gold Bracelet"
                    >
                </div>

                <div class="product-info">
                    <p class="product-name">
                        Gold Bracelet
                    </p>

                    <p class="product-category">
                        Accessories
                    </p>

                    <p class="product-price">
                        $65
                    </p>
                </div>

            </article>


            <!-- PRODUCT 6 -->
            <article class="product-card">

                <div class="product-image">
                    <img
                        src="../../../assets/images/collection/collection7.png"
                        alt="Gold Ring"
                    >
                </div>

                <div class="product-info">
                    <p class="product-name">
                        Gold Ring
                    </p>

                    <p class="product-category">
                        Accessories
                    </p>

                    <p class="product-price">
                        $60
                    </p>
                </div>

            </article>

        </section>


        <!-- =========================
             YOU MAY ALSO LIKE
        ========================== -->

        <section class="you-may-also-like">

            <div class="ymal-title">

                <h2>
                    YOU MAY ALSO LIKE
                </h2>

                <div class="ymal-line"></div>

            </div>


            <div class="ymal-slider">

                <article class="ymal-card">

                    <img
                        src="../../../assets/images/collection/collection2.png"
                        alt="Black Collection"
                    >

                    <p>
                        BLACK COLLECTION
                    </p>

                </article>


                <article class="ymal-card">

                    <img
                        src="../../../assets/images/collection/collection3.png"
                        alt="Hats and Heels"
                    >

                    <p>
                        HATS & HEELS
                    </p>

                </article>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <div id="footer-component"></div>


    <!-- JAVASCRIPT -->
    <script
        type="module"
        src="./collection_detail.js"
    ></script>

</body>

</html>
