<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart Empty</title>

    <!-- Font: Tenor Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap"
        rel="stylesheet">

    <!-- Cart Empty CSS -->
    <link rel="stylesheet" href="./cart_empty.css">
</head>

<body>

    <main class="cart-empty">

        <!-- Close -->
        <button
            type="button"
            class="cart-close"
            aria-label="Close cart">

            <img
                src="../../../assets/icons/Close.svg"
                alt="">

        </button>


        <!-- Cart title -->
        <h1 class="cart-title">
            CART
        </h1>


        <!-- Empty cart message -->
        <p class="cart-empty-message">
            You have no items in your Shopping Bag.
        </p>


        <!-- Continue shopping -->
        <button
            type="button"
            class="continue-shopping">

            <img
                src="../../../assets/icons/shopping-bag.svg"
                alt=""
                class="shopping-bag-icon">

            <span class="continue-shopping-text">
                CONTINUE SHOPPING
            </span>

        </button>

    </main>

    <script type="module" src="./cart_empty.js"></script>

</body>

</html>
