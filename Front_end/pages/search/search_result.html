<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Open Fashion</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../components/common/common.css">
  <link rel="stylesheet" href="../../components/layout/header/header.css">
  <link rel="stylesheet" href="../../components/layout/footer/footer.css">
</head>
<body class="bg-gray-100 flex flex-col items-center min-h-screen font-sans py-6">

  <div class="w-full max-w-[375px] bg-white min-h-[667px] p-6 shadow-xl relative">
    
    <div class="relative pb-2 border-b border-gray-400 flex items-center justify-between">
      <div class="flex items-center gap-3 w-full pr-2">
        <svg class="w-5 h-5 text-gray-700 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" placeholder="Search items" class="w-full text-sm outline-none text-gray-700 placeholder:text-gray-400 bg-transparent">
      </div>
      <button class="text-gray-600 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="mt-6">
      <p class="text-xs text-gray-400 mb-3">Recent search</p>
      <div class="flex flex-wrap gap-2">
        <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-gray-100 text-gray-600 text-xs rounded-full">
          Dress 
          <button class="text-gray-400 hover:text-gray-600">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </span>
        <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-gray-100 text-gray-600 text-xs rounded-full">
          Collection 
          <button class="text-gray-400 hover:text-gray-600">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </span>
        <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-gray-100 text-gray-600 text-xs rounded-full">
          Nike 
          <button class="text-gray-400 hover:text-gray-600">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </span>
      </div>
    </div>

    <div class="mt-8">
      <p class="text-xs text-gray-400 mb-4">Popular search terms</p>
      <ul class="space-y-4 text-sm text-gray-800 font-medium">
        <li><a href="#" class="hover:text-orange-400">Trend</a></li>
        <li><a href="#" class="hover:text-orange-400">Dress</a></li>
        <li><a href="#" class="hover:text-orange-400">Bag</a></li>
        <li><a href="#" class="hover:text-orange-400">Tshirt</a></li>
        <li><a href="#" class="hover:text-orange-400">Beauty</a></li>
        <li><a href="#" class="hover:text-orange-400">Accessories</a></li>
      </ul>
    </div>

  </div>

</body>
</html>
